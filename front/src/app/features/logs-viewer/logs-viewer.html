<section class="card">
  <div class="row-between">
    <h2>Logs en tiempo real</h2>
    <div class="logs-controls">
      @if (degraded()) {
        <span
          class="degraded"
          title="El stream en vivo no está disponible; se está sondeando cada segundo."
        >
          <i class="pi pi-exclamation-triangle"></i> sin stream
        </span>
      }
      <div class="logs-toggle">
        <p-checkbox
          [(ngModel)]="timestampsModel"
          [binary]="true"
          inputId="timestamps"
          (ngModelChange)="store.setShowTimestamps($event)"
        />
        <label for="timestamps">marca de tiempo</label>
      </div>
      <div class="logs-toggle">
        <p-checkbox
          [(ngModel)]="autoscrollModel"
          [binary]="true"
          inputId="autoscroll"
          (ngModelChange)="store.setAutoscroll($event)"
        />
        <label for="autoscroll">auto-scroll</label>
      </div>
      <p-button
        label="Limpiar"
        icon="pi pi-trash"
        [outlined]="true"
        size="small"
        (onClick)="clear()"
      />
    </div>
  </div>

  <div #logsEl class="logs" [class.empty]="!logs().length" (scroll)="onScroll()">
    @for (e of logs(); track e.seq) {
      <div [class]="'ln-' + e.stream">
        @if (showTimestamps()) {
          <span class="ts">+{{ e.t / 1000 | fmtNum: 1 }}s</span>
        }
        <span class="msg">{{ e.msg }}</span>
      </div>
    } @empty {
      <span class="muted">Sin logs todavía.</span>
    }
  </div>
</section>
