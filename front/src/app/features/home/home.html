<main class="home">
  <!-- Tabs: configuración del servidor vs benchmark/historial. -->

  <p-tabs [value]="tab()" (valueChange)="tab.set($any($event))">
    <p-tablist>
      <p-tab [value]="0">Script server</p-tab>
      <p-tab [value]="1">Benchmark</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel [value]="0">
        <app-script-editor />
      </p-tabpanel>
      <p-tabpanel [value]="1">
        <div class="sections">
          <app-benchmark-panel />
          <!-- Último resultado: visible cuando existe, debajo de las métricas. -->
          <app-last-result />
          <app-response-card />
        </div>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>

  <app-history-table />

  <!-- Los modales se cargan la primera vez que se abren: así chart.js y el
       optimizador salen del chunk inicial, que es lo que se descarga siempre. -->
  @defer (when store.showCompare()) {
    <app-compare-modal />
  }
  @defer (when store.showChart()) {
    <app-chart-modal />
  }
  @defer (when store.showOptimizer()) {
    <app-optimizer-modal />
  }

  <!-- Logs en tiempo real: siempre presentes, como última sección de la página. -->
  <app-logs-viewer />
</main>
